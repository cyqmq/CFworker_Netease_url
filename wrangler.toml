name = "cfworker-netease-url"
main = "src/worker.js"
compatibility_date = "2024-09-23"

# 设置 Cookie（黑胶会员账号）：
# 在 Cloudflare 控制台 Workers → 本 Worker → Settings → Variables and Secrets 添加 COOKIE（类型 Secret/Text）。
# 注意：不要在这里用 [vars] COOKIE = "" 写死，否则每次 git push 部署都会把控制台的 COOKIE 覆盖成空值。
# 本地调试可把 Cookie 写进 .dev.vars（COOKIE='MUSIC_U=xxxx; os=pc;'）。

# KV 存储：Cookie 池 + 直链缓存（可选）
# 绑定名固定为 NETEASE_KV（代码中用 env.NETEASE_KV 读取，改名会读不到）。
# 一键启用：直接运行 ./deploy.sh（会自动创建/复用命名空间并把真实 id 注入后部署）。
# 手动启用：取消下面注释并把 id 换成真实值，再 wrangler deploy。
# [[kv_namespaces]]
# binding = "NETEASE_KV"
# id = "你的真实KV命名空间id"

[assets]
directory = "public"
