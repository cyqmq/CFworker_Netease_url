name = "cfworker-netease-url"
main = "src/worker.js"
compatibility_date = "2024-09-23"

# 设置 Cookie（黑胶会员账号）：在 Cloudflare 控制台 Workers → 本Worker → Settings → Variables 添加 COOKIE 秘密
# COOKIE 格式例如：MUSIC_U=xxxx; os=pc; appver=8.9.70;
[vars]
# 留空即可，部署后用 secret 设置
COOKIE = ""

# KV 存储：Cookie 池 + 直链缓存（可选）
# 绑定名固定为 NETEASE_KV（代码中用 env.NETEASE_KV 读取，改名会读不到）。
# 一键启用：直接运行 ./deploy.sh（会自动创建/复用命名空间并把真实 id 注入后部署）。
# 手动启用：取消下面注释并把 id 换成真实值，再 wrangler deploy。
# [[kv_namespaces]]
# binding = "NETEASE_KV"
# id = "你的真实KV命名空间id"

[assets]
directory = "public"
