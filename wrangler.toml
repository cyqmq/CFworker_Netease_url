name = "cfworker-netease-url"
main = "src/worker.js"
compatibility_date = "2024-09-23"

# 设置 Cookie（黑胶会员账号）：
# 在 Cloudflare 控制台 Workers → 本 Worker → Settings → Variables and Secrets 添加 COOKIE（类型 Secret/Text）。
# 注意：不要在这里用 [vars] COOKIE = "" 写死，否则每次 git push 部署都会把控制台的 COOKIE 覆盖成空值。
# 本地调试可把 Cookie 写进 .dev.vars（COOKIE='MUSIC_U=xxxx; os=pc;'）。

# KV 存储：Cookie 池 + 直链缓存（可选）
# 绑定名固定为 NETEASE_KV（代码中用 env.NETEASE_KV 读取，改名会读不到）。
# 不写 id：部署时由 wrangler 自动创建并绑定该命名空间（fork 安全，详见 README）。
# 若想复用已存在的 KV（例如已填好 cookie_list / api_token），请在 Builds 的
# Settings → Variables and Secrets 添加 Secret：名称 KV_ID，值=该命名空间 id；
# ./deploy.sh 会自动把 id 注入后再部署。不设置则每次部署自动新建一个空 KV。
[[kv_namespaces]]
binding = "NETEASE_KV"

[assets]
directory = "public"
